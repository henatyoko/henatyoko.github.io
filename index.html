<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLドラマ図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14162B;
    --bg-deep:#0D0E1F;
    --surface:#242850;
    --surface-hi:#2E3260;
    --line:rgba(245,241,232,0.16);
    --accent:#FFA87A;
    --accent-dim:rgba(255,168,122,0.20);
    --gold:#FFD166;
    --text:#FFFFFF;
    --text-dim:#D6D6F0;
    --text-faint:#ADADD6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background-color:var(--bg);}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(1100px 520px at 12% -10%, rgba(255,168,122,0.14), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(173,173,214,0.10), transparent 55%);
    background-repeat:no-repeat;
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:48px 20px 80px;}

  /* ---------- HERO ---------- */
  .hero{margin-bottom:36px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin:0 0 14px;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:clamp(34px,6vw,54px);
    line-height:1.25;
    margin:0 0 14px;
    letter-spacing:.02em;
  }
  h1 span{color:var(--accent);}
  .lede{
    color:var(--text-dim);
    font-size:15.5px;
    line-height:1.9;
    max-width:56ch;
    margin:0 0 26px;
  }
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    border:1px solid var(--line);
    border-radius:100px;
    padding:8px 16px;
    font-size:13px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    background:rgba(255,255,255,0.02);
  }
  .stat b{color:var(--text);font-weight:600;}

  /* ---------- TONIGHT'S PICK ---------- */
  .pick{
    margin:30px 0 40px;
    border:1px solid rgba(255,139,94,0.35);
    background:linear-gradient(135deg, rgba(255,139,94,0.14), rgba(255,209,102,0.05));
    border-radius:18px;
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .pick-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:0 0 8px;
  }
  .pick-title{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 4px;
  }
  .pick-meta{color:var(--text-dim);font-size:13px;}
  .pick-stars{color:var(--gold);letter-spacing:2px;font-size:15px;}
  .shuffle-btn{
    background:var(--accent);
    color:#1A1230;
    border:none;
    border-radius:100px;
    padding:12px 22px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .shuffle-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,139,94,0.35);}
  .shuffle-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  /* ---------- CONTROLS ---------- */
  .controls{
    position:sticky;top:0;
    background:linear-gradient(var(--bg) 82%, transparent);
    padding:14px 0 18px;
    z-index:5;
  }
  .search-box{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:14px;
  }
  .search-box svg{flex:none;opacity:.6;}
  .search-box input{
    background:transparent;border:none;outline:none;
    color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:15px;width:100%;
  }
  .search-box input::placeholder{color:var(--text-faint);}

  .stamps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .stamp{
    position:relative;
    border:1.5px dashed rgba(245,241,232,0.28);
    border-radius:999px;
    padding:7px 14px 7px 12px;
    font-size:12.5px;
    color:var(--text-dim);
    background:transparent;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .stamp .n{opacity:.65;}
  .stamp:hover{border-color:rgba(255,139,94,0.5);color:var(--text);}
  .stamp.active{
    border-style:solid;
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-dim);
    transform:rotate(-2deg);
  }
  .stamp:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px;}
  .chip{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-dim);
    border-radius:8px;
    padding:6px 12px;
    font-size:12.5px;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
    transition:all .15s ease;
  }
  .chip:hover{border-color:rgba(255,255,255,0.25);color:var(--text);}
  .chip.active{background:var(--surface-hi);border-color:var(--gold);color:var(--gold);}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .result-count{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--text-faint);
  }

  /* ---------- LIST ---------- */
  .list{margin-top:18px;border-top:1px solid var(--line);}
  .row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:14px;
    align-items:center;
    padding:14px 6px;
    border-bottom:1px solid var(--line);
    transition:background .12s ease;
  }
  .row:hover{background:rgba(255,255,255,0.02);}
  .row-main{min-width:0;}
  .row-title{
    font-size:15.5px;
    font-weight:500;
    color:var(--text);
    overflow-wrap:anywhere;
  }
  .row-tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:5px;
    color:var(--text-dim);
    background:rgba(255,255,255,0.08);
    border:1px solid var(--line);
  }
  .tag.country{color:#FFC7A6;border-color:rgba(255,168,122,0.45);background:rgba(255,168,122,0.14);}
  .tag.watching{color:#B7EAC2;border-color:rgba(143,211,160,0.45);background:rgba(143,211,160,0.14);}
  .tag.movie{color:var(--text-dim);}
  .row-synopsis{
    margin-top:7px;
    font-size:13px;
    line-height:1.65;
    color:var(--text-dim);
    max-width:60ch;
  }
  .row-stars{
    color:var(--gold);
    letter-spacing:2px;
    font-size:14px;
    white-space:nowrap;
    min-width:52px;
    text-align:right;
  }
  .row-stars.empty{color:var(--text-faint);opacity:.35;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
  }
  .empty-state .big{font-family:'Shippori Mincho',serif;font-size:20px;color:var(--text-dim);margin-bottom:8px;}

  footer{
    margin-top:50px;
    padding-top:20px;
    border-top:1px solid var(--line);
    color:var(--text-faint);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }

  @media (max-width:520px){
    .row{grid-template-columns:1fr auto;}
    .row-stars{grid-column:2;grid-row:1;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <p class="eyebrow">Personal BL Viewing Archive</p>
    <h1>BLドラマ<span>図鑑</span></h1>
    <p class="lede">通勤も、昼休みも、寝る間を惜しんで見てきたアジア圏＋αのBLドラマたち。国別・評価別に絞り込んで、次に見る一本を探せる個人アーカイブです。</p>
    <div class="stat-row" id="statRow"></div>
  </div>

  <div class="pick" id="pickBox">

    <div class="stamps" id="stampRow"></div>
    <div class="filter-row" id="filterRow">

  </div>

  <div class="list" id="listBox"></div>
  <div class="empty-state" id="emptyState" style="display:none;">

    <p>検索条件やフィルターを変えてみてください。</p>

  <footer>henatyoko's BL archive — 240 titles · 8 countries · あらすじは★★以上の作品から順次追加中</footer>
</div>

: 3, "watching": false, "movie": false, "synopsis": "アメリカ大統領の息子とイギリス王子が、政治的な因縁から生まれた対立を経て惹かれ合っていくラブストーリー。"}, {"title": "YoungRoyals Season2（スウェーデン）", "country": "欧米", "rating": 2, "watching": false, "movie": false, "synopsis": "スウェーデンの寄宿学校を舞台にした王子と生徒の恋の続編。1期のその後の関係の揺れを描く。"}]
;

const state = {
  q: "",
  country: "ALL",
  rating: "ALL",
  watching: false,
};

const countryOrder = ["日本","タイ","韓国","台湾","フィリピン","ベトナム","中国","欧米"];
const FLAGS = {
  "日本":"🇯🇵","タイ":"🇹🇭","韓国":"🇰🇷","台湾":"🇹🇼",
  "フィリピン":"🇵🇭","ベトナム":"🇻🇳","中国":"🇨🇳","欧米":"🌍"
};

function starString(n){
  if(n<=0) return "—";
  return "★".repeat(n);
}

function computeCounts(){
  const counts = {};
  countryOrder.forEach(c => counts[c]=0);
  DATA.forEach(d => counts[d.country] = (counts[d.country]||0)+1);
  return counts;
}

function renderStats(){
  const total = DATA.length;
  const topRated = DATA.filter(d=>d.rating>=2).length;
  const watching = DATA.filter(d=>d.watching).length;
  document.getElementById('statRow').innerHTML = `
    <div class="stat"><b>${total}</b>本 収録</div>
    <div class="stat"><b>${countryOrder.length}</b>ヶ国・地域</div>
    <div class="stat"><b>${topRated}</b>本が ★★以上</div>
    <div class="stat"><b>${watching}</b>本 視聴中</div>
  `;
}

function renderStamps(){
  const counts = computeCounts();
  const el = document.getElementById('stampRow');
  let html = `<button class="stamp ${state.country==='ALL'?'active':''}" data-country="ALL">すべて <span class="n">${DATA.length}</span></button>`;
  countryOrder.forEach(c=>{
    html += `<button class="stamp ${state.country===c?'active':''}" data-country="${c}">${FLAGS[c]||''} ${c} <span class="n">${counts[c]}</span></button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.stamp').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.country = btn.dataset.country;
      render();
    });
  });
}

function renderFilters(){
  const el = document.getElementById('filterRow');
  const ratingOptions = [
    {key:'ALL', label:'評価すべて'},
    {key:'2', label:'★★以上'},
    {key:'1', label:'★1つ以上'},
    {key:'0', label:'評価なし'},
  ];
  let html = ratingOptions.map(o=>`<button class="chip ${state.rating===o.key?'active':''}" data-rating="${o.key}">${o.label}</button>`).join('');
  html += `<button class="chip ${state.watching?'active':''}" id="watchingChip">視聴中のみ</button>`;
  html += `<span class="result-count" id="resultCount"></span>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-rating]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.rating = btn.dataset.rating;
      render();
    });
  });
  document.getElementById('watchingChip').addEventListener('click', ()=>{
    state.watching = !state.watching;
    render();
  });
}

function filteredData(){
  return DATA.filter(d=>{
    if(state.country!=='ALL' && d.country!==state.country) return false;
    if(state.rating!=='ALL'){
      if(state.rating==='2' && d.rating<2) return false;
      if(state.rating==='1' && d.rating<1) return false;
      if(state.rating==='0' && d.rating!==0) return false;
    }
    if(state.watching && !d.watching) return false;
    if(state.q){
      const q = state.q.toLowerCase();
      if(!d.title.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderList(){
  const data = filteredData();
  const listBox = document.getElementById('listBox');
  const emptyState = document.getElementById('emptyState');
  const countEl = document.getElementById('resultCount');
  if(countEl) countEl.textContent = `${data.length}件表示`;

  if(data.length===0){
    listBox.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  listBox.innerHTML = data.map(d=>{
    const tags = [`<span class="tag country">${FLAGS[d.country]||''} ${d.country}</span>`];
    if(d.watching) tags.push(`<span class="tag watching">視聴中</span>`);
    if(d.movie) tags.push(`<span class="tag movie">映画</span>`);
    const starClass = d.rating<=0 ? "row-stars empty" : "row-stars";
    const synopsis = d.synopsis ? `<div class="row-synopsis">${escapeHtml(d.synopsis)}</div>` : "";
    return `
      <div class="row">
        <div class="row-main">
          <div class="row-title">${escapeHtml(d.title)}</div>
          <div class="row-tags">${tags.join('')}</div>
          ${synopsis}
        </div>
        <div class="${starClass}">${starString(d.rating)}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pickTonight(){
  const pool = DATA.filter(d=>d.rating>=2);
  const source = pool.length ? pool : DATA;
  const item = source[Math.floor(Math.random()*source.length)];
  document.getElementById('pickTitle').textContent = item.title;
  document.getElementById('pickStars').textContent = starString(item.rating);
  document.getElementById('pickCountry').textContent = (FLAGS[item.country]||'') + ' ' + item.country + (item.watching ? ' ・視聴中' : '');
  document.getElementById('pickSynopsis').textContent = item.synopsis || '';
}

function render(){
  renderStamps();
  renderFilters();
  renderList();
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.q = e.target.value;
  renderList();
  const countEl = document.getElementById('resultCount');
  if(countEl) countEl.textContent = `${filteredData().length}件表示`;
});

document.getElementById('shuffleBtn').addEventListener('click', pickTonight);

renderStats();
pickTonight();
render();
</script>

</html>
